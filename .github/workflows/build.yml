name: Build Android App for Play Store

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JAVA_OPTS: "-Djava.awt.headless=true"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Djava.awt.headless=true -Dorg.gradle.daemon=false"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Find Latest Zip and Extract
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2-)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No zip file found in root or subfolders."
            exit 1
          fi
          mkdir -p extracted_project
          unzip -q -o "$ZIP_FILE" -d extracted_project

      - name: Locate Project Root
        run: |
          GRADLEW_PATH=$(find extracted_project -type f -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew script not found inside extracted files."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Decode Keystore File
        run: |
          KEYSTORE_DIR="${{ env.PROJECT_DIR }}/app"
          mkdir -p "$KEYSTORE_DIR"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_DIR/release.jks"

      - name: Build and Sign Signed AAB
        run: |
          cd "${{ env.PROJECT_DIR }}"
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="${{ env.PROJECT_DIR }}/app/release.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEY_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/app-release.aab
