name: Build and Sign AAB

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract Latest Uploaded Project Zip
      run: |
        # रिपॉजिटरी में सबसे हाल ही में (Latest) अपलोड या मॉडिफाई की गई .zip फ़ाइल को खोजें
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" -type f -printf '%T+ %p\n' | sort -r | head -n 1 | cut -d' ' -f2-)
        
        if [ -n "$ZIP_FILE" ]; then
          echo "Using latest uploaded zip: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted_project
          PROJECT_DIR=$(find extracted_project -maxdepth 3 -name "gradlew" -exec dirname {} \;)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
        else
          echo "No zip file found, using root directory."
          echo "PROJECT_DIR=." >> $GITHUB_ENV
        fi

    - name: Decode Keystore File
      run: |
        cd "$PROJECT_DIR"
        mkdir -p app/app
        # Gradle config requires "my-upload-key.jks"
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/my-upload-key.jks
        cp app/my-upload-key.jks app/app/my-upload-key.jks
        cp app/my-upload-key.jks my-upload-key.jks

    - name: Build and Sign Signed AAB
      run: |
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew bundleRelease \
          -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
          -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
          -PKEY_PASSWORD="${{ secrets.KEY_PASSWORD }}" \
          -Pandroid.injected.signing.store.file="app/my-upload-key.jks" \
          -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
          -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
          -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: |
          ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
          
