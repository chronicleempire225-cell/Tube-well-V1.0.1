name: Build and Sign AAB

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract Project Zip
      run: |
        # Zip file ko find karke extract karna
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          unzip -o "$ZIP_FILE" -d extracted_project
          PROJECT_DIR=$(find extracted_project -maxdepth 2 -name "gradlew" -exec dirname {} \;)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
        else
          echo "PROJECT_DIR=." >> $GITHUB_ENV
        fi

    - name: Decode Keystore File
      run: |
        cd "$PROJECT_DIR"
        mkdir -p app
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

    - name: Build and Sign Signed AAB
      run: |
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew bundleRelease \
          -Pandroid.injected.signing.store.file="app/release.jks" \
          -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
          -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
          -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: |
          **/app/build/outputs/bundle/release/*.aab
