Name: Build and Sign AAB

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract Project Zip
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          unzip -o "$ZIP_FILE" -d extracted_project
          PROJECT_DIR=$(find extracted_project -maxdepth 3 -name "gradlew" -exec dirname {} \;)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
        else
          echo "PROJECT_DIR=." >> $GITHUB_ENV
        fi

    - name: Decode Keystore File
      run: |
        cd "$PROJECT_DIR"
        mkdir -p app/app
        # Gradle config requires "my-upload-key.jks"
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/my-upload-key.jks
        cp app/my-upload-key.jks app/app/my-upload-key.jks
        cp app/my-upload-key.jks my-upload-key.jks

    - name: Build and Sign Signed AAB
      run: |
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew bundleRelease \
          -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
          -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
          -PKEY_PASSWORD="${{ secrets.KEY_PASSWORD }}" \
          -Pandroid.injected.signing.store.file="app/my-upload-key.jks" \
          -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
          -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
          -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

    - name: Find Latest AAB File
      id: find_aab
      run: |
        cd "$PROJECT_DIR"
        # सबसे नई .aab फ़ाइल का पता लगाएं
        LATEST_AAB=$(find . -name "*.aab" -type f -print0 | xargs -0 ls -t | head -n 1)
        if [ -z "$LATEST_AAB" ]; then
          echo "Error: No AAB file found!"
          exit 1
        fi
        echo "Found latest AAB: $LATEST_AAB"
        # एब्सोल्यूट पाथ या सही पाथ सेट करें ताकि अपलोड में दिक्कत न हो
        echo "aab_path=$PROJECT_DIR/$LATEST_AAB" >> $GITHUB_ENV

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: ${{ env.aab_path }}
        
