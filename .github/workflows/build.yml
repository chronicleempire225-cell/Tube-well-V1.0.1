name: Build Android App for Play Store

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JAVA_OPTS: "-Djava.awt.headless=true"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Djava.awt.headless=true -Dorg.gradle.daemon=false"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Find Latest Zip and Extract
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" -print -quit | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No zip file found in root or subfolders."
            exit 1
          fi
          mkdir -p extracted_project
          unzip -q "$ZIP_FILE" -d extracted_project

      - name: Locate Project Root
        run: |
          GRADLE_PATH=$(find extracted_project -type f -name "gradlew" | head -n 1)
          if [ -z "$GRADLE_PATH" ]; then
            echo "ERROR: gradlew script not found inside extracted files."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Decode Keystore File (Both Locations)
        run: |
          cd "$PROJECT_DIR"
          mkdir -p app
          # दोनों संभव स्थानों पर कीस्टोर डिकोड कर देते हैं ताकि पाथ की कोई समस्या न रहे
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
          cp release.jks app/release.jks

      - name: Build and Sign Signed AAB (Auto Path Detection)
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          
          # जाँच करें कि कीस्टोर app फोल्डर में है या रूट में
          if [ -f "app/release.jks" ]; then
            KEYSTORE_PATH="app/release.jks"
          else
            KEYSTORE_PATH="release.jks"
          fi
          
          echo "Using keystore path: $KEYSTORE_PATH"
          
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
